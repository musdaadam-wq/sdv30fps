name: Build Fps45

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Write mod source and compile-only stubs
        run: |
          mkdir -p smapi game mod
          cat > smapi/StardewModdingAPI.csproj <<'FILE_END_0'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <AssemblyName>StardewModdingAPI</AssemblyName>
              <RootNamespace>StardewModdingAPI</RootNamespace>
            </PropertyGroup>
          </Project>
          FILE_END_0
          cat > smapi/Stub.cs <<'FILE_END_1'
          using System;
          namespace StardewModdingAPI.Events
          {
              public class GameLaunchedEventArgs { }
              public class UpdateTickedEventArgs { }
              public interface IGameLoopEvents
              {
                  event EventHandler<GameLaunchedEventArgs> GameLaunched;
                  event EventHandler<UpdateTickedEventArgs> UpdateTicked;
              }
          }
          namespace StardewModdingAPI
          {
              public enum LogLevel { Trace, Debug, Info, Warn, Error, Alert }
              public interface IMonitor { void Log(string message, LogLevel level = LogLevel.Trace); }
              public interface IModEvents { Events.IGameLoopEvents GameLoop { get; } }
              public interface ICommandHelper { ICommandHelper Add(string name, string documentation, Action<string, string[]> callback); }
              public interface IModHelper
              {
                  IModEvents Events { get; }
                  ICommandHelper ConsoleCommands { get; }
                  TConfig ReadConfig<TConfig>() where TConfig : class, new();
                  void WriteConfig<TConfig>(TConfig config) where TConfig : class, new();
              }
              public abstract class Mod
              {
                  public IModHelper Helper { get; internal set; }
                  public IMonitor Monitor { get; internal set; }
                  public abstract void Entry(IModHelper helper);
              }
          }
          FILE_END_1
          cat > game/StardewValley.csproj <<'FILE_END_2'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <AssemblyName>Stardew Valley</AssemblyName>
              <RootNamespace>StardewValley</RootNamespace>
              <NoWarn>CS0649</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="MonoGame.Framework.DesktopGL" Version="3.8.1.303" />
            </ItemGroup>
          </Project>
          FILE_END_2
          cat > game/Stub.cs <<'FILE_END_3'
          namespace StardewValley
          {
              public class Game1 : Microsoft.Xna.Framework.Game
              {
                  public static Game1 game1;
              }
          }
          FILE_END_3
          cat > mod/Fps45.csproj <<'FILE_END_4'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <AssemblyName>Fps45</AssemblyName>
              <RootNamespace>Fps45</RootNamespace>
              <Version>1.0.0</Version>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../smapi/StardewModdingAPI.csproj" Private="false" />
              <ProjectReference Include="../game/StardewValley.csproj" Private="false" />
            </ItemGroup>
          </Project>
          FILE_END_4
          cat > mod/manifest.json <<'FILE_END_5'
          {
            "Name": "Fps45",
            "Author": "Eric",
            "Version": "1.0.0",
            "Description": "Automatically caps Stardew Valley at 45 FPS.",
            "UniqueID": "Eric.Fps45",
            "EntryDll": "Fps45.dll",
            "MinimumApiVersion": "4.0.0"
          }
          FILE_END_5
          cat > mod/ModConfig.cs <<'FILE_END_6'
          namespace Fps45
          {
              /// <summary>User settings, stored in config.json next to the mod.</summary>
              public class ModConfig
              {
                  /// <summary>The frame rate to run the game at.</summary>
                  public int TargetFps { get; set; } = 45;
              }
          }
          FILE_END_6
          cat > mod/ModEntry.cs <<'FILE_END_7'
          using System;
          using StardewModdingAPI;
          using StardewModdingAPI.Events;
          using StardewValley;

          namespace Fps45
          {
              /// <summary>Runs Stardew Valley at a fixed frame rate (45 FPS by default) without any manual commands.</summary>
              public class ModEntry : Mod
              {
                  private TimeSpan Target;

                  public override void Entry(IModHelper helper)
                  {
                      ModConfig config = helper.ReadConfig<ModConfig>();
                      int fps = Math.Clamp(config.TargetFps, 1, 1000);
                      if (fps != config.TargetFps)
                      {
                          config.TargetFps = fps;
                          helper.WriteConfig(config);
                      }
                      this.SetTarget(fps);

                      helper.Events.GameLoop.GameLaunched += (_, _) => this.Apply();
                      // Re-check every tick: cheap, and keeps the cap in place if the game resets its timing
                      // (e.g. after changing video options or returning to the title screen).
                      helper.Events.GameLoop.UpdateTicked += (_, _) => this.Apply();

                      helper.ConsoleCommands.Add("fps", "Change the frame rate until restart.\nUsage: fps <number>  (e.g. fps 60)", this.OnFpsCommand);
                  }

                  private void SetTarget(int fps)
                  {
                      this.Target = TimeSpan.FromSeconds(1.0 / fps);
                  }

                  private void Apply()
                  {
                      Game1 game = Game1.game1;
                      if (game == null)
                          return;

                      if (!game.IsFixedTimeStep)
                          game.IsFixedTimeStep = true;
                      if (game.TargetElapsedTime != this.Target)
                          game.TargetElapsedTime = this.Target;
                  }

                  private void OnFpsCommand(string command, string[] args)
                  {
                      if (args.Length != 1 || !int.TryParse(args[0], out int fps) || fps < 1 || fps > 1000)
                      {
                          this.Monitor.Log("Usage: fps <number between 1 and 1000>", LogLevel.Warn);
                          return;
                      }
                      this.SetTarget(fps);
                      this.Apply();
                      this.Monitor.Log($"Frame rate set to {fps} FPS (until restart; edit config.json to make it permanent).", LogLevel.Info);
                  }
              }
          }
          FILE_END_7

      - name: Build
        run: dotnet build mod/Fps45.csproj -c Release

      - name: Package
        run: |
          mkdir -p out/Fps45
          cp mod/bin/Release/net6.0/Fps45.dll out/Fps45/
          cp mod/manifest.json out/Fps45/

      - uses: actions/upload-artifact@v4
        with:
          name: Fps45
          path: out
